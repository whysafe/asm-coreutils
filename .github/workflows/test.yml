name: test

on:
  push:
  pull_request:

jobs:
  test:
    # pinned: the comparison is against GNU coreutils and util-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm bsdextrautils
      - name: Build
        run: make
      - name: Test against GNU coreutils / util-linux
        run: make test
      - name: Binary sizes
        run: |
          for p in cat wc hexdump rev; do strip -o "/tmp/s-$p" "bin/$p"; done
          ls -l bin/cat bin/wc bin/hexdump bin/rev /tmp/s-*
